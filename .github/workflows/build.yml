name: Build and test
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python fixture dependencies
        run: python -m pip install Pillow
      - name: Build and non-UI tests
        shell: pwsh
        run: ./scripts/build.ps1 -Test core,drop,mail_setup,settings_cleanup,history,rtf_fit,docx_text,doc_conversion,doc_format,reader_loading,reader_bridge,reader_native_loading,instance_forwarding
      - name: SMTP integration tests
        run: python tests/smtp_fixture.py
      - name: Cover integration tests
        run: |
          python tests/cover_fixture.py

